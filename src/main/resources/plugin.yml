name: Woolbattle
version: 1.0
main: codes.Elix.Woolbattle.main.Woolbattle
api-version: 1.19
authors: [ N4med, Elix ]
description: Gamemode for Minecraft
depend:
  - FastAsyncWorldEdit

commands:
  setup:
  start:
  test:
  performance:
  countdown:
  all:
  setlive:
  build:
  hitted:
  debug:
  switchteam:
  fix:
  visualizewool:
  reloadperks:
  perkconfig:
    description: Configure perk settings
    permission: woolbattle.admin.config
  gamesettings:
    description: Configure game settings
    permission: woolbattle.admin.gamesettings
    aliases: [gameconfig, gsettings]

permissions:
  woolbattle.admin.config:
    description: Access to perk configuration GUI
    default: op
  woolbattle.admin.gamesettings:
    description: Access to game settings configuration GUI
    default: op